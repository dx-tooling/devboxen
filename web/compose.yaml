# devboxen-web: the boxes in the browser (docs/web.md). Run by `devboxen deploy` (Ansible's
# deploy.yml) in /opt/devboxen/web with an .env file it writes. Profiles:
#
#   front          the front: the UI, the password, every host's boxes (its own, and the
#                  other hosts' through the SSH tunnels of ansible/web.yml)
#   front + auto   … with Caddy in front of it: HTTPS for DEVBOXEN_WEB_DOMAIN on ports 80
#                  and 443 (TLS mode "auto")
#   front alone    behind a reverse proxy of your own (TLS mode "proxy"): the instance's
#                  compose.override.yaml puts the front on that proxy's network
#   backend        every other host: its boxes on 127.0.0.1:7700, no password; only the
#                  front's SSH tunnel reaches it
#
# Neither has the Docker socket. They see the boxes' sockets (/var/lib/devbox/web,
# read-only: connecting to a socket needs no write access to the mount) and devbox-admin's
# box list. Root in the container only to connect to sockets of other owners (the boxes'
# dev, the tunnel's root): every capability but DAC_OVERRIDE is dropped.
name: devboxen-web

x-common: &common
  build:
    context: ..
    dockerfile: web/Dockerfile
  image: ${DEVBOXEN_WEB_IMAGE:-devboxen-web:local}
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  cap_add: [DAC_OVERRIDE]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" }

services:
  front:
    <<: *common
    profiles: [front]
    container_name: devboxen-web
    environment:
      DEVBOX_WEB_LISTEN: ":8080"
      DEVBOX_WEB_HTPASSWD: /run/secrets/htpasswd
      DEVBOX_WEB_SESSION_KEY: /run/secrets/session-key
      DEVBOX_WEB_REMOTES: ${DEVBOXEN_WEB_REMOTES:-}
      # The session cookie's domain, and the parent of the exposed ports' addresses.
      DEVBOX_WEB_DOMAIN: ${DEVBOXEN_WEB_DOMAIN:-}
      # Caddy's on-demand TLS question (profile auto only; see Caddyfile).
      DEVBOX_WEB_ASK_LISTEN: ${DEVBOXEN_WEB_ASK_LISTEN:-}
    volumes:
      - /var/lib/devbox/web:/srv/devbox-web:ro
      - /var/lib/devbox/boxes:/srv/devbox-boxes:ro
      - /etc/devbox-host:/etc/devbox-host:ro
      # root-only files next to this one, written by deploy.yml
      - ./htpasswd:/run/secrets/htpasswd:ro
      - ./session-key:/run/secrets/session-key:ro
    networks: [web]

  caddy:
    profiles: [auto]
    image: caddy:2.10.2-alpine
    container_name: devboxen-caddy
    restart: unless-stopped
    depends_on: [front]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DEVBOXEN_WEB_DOMAIN: ${DEVBOXEN_WEB_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [web]
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

  backend:
    <<: *common
    profiles: [backend]
    container_name: devboxen-web
    # Host network, so that 127.0.0.1 is the host's loopback: the SSH tunnel's end. (A
    # published port would be a DNAT rule, reachable from more than the host itself.)
    network_mode: host
    environment:
      DEVBOX_WEB_LISTEN: 127.0.0.1:7700
    volumes:
      - /var/lib/devbox/web:/srv/devbox-web:ro
      - /var/lib/devbox/boxes:/srv/devbox-boxes:ro
      - /etc/devbox-host:/etc/devbox-host:ro

networks:
  web: {}

volumes:
  caddy-data:
  caddy-config:
