name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o /dev/null ./cmd/devboxen

  web-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f web/Dockerfile -t devboxen-web:ci .
      - run: DEVBOXEN_WEB_DOMAIN=ci.example docker compose -f web/compose.yaml --profile front --profile auto config -q

  ansible:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pipx install ansible-core
      - run: ansible-galaxy collection install -r ansible/requirements.yml
      - run: ansible-playbook -i ansible/inventory.example.ini --syntax-check ansible/site.yml

  tofu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
      - run: tofu fmt -check -recursive tofu/
      - run: cd tofu/aws-host && tofu init -backend=false -input=false && tofu validate
      # The configuration `devboxen host add` writes, with this module.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: DEVBOXEN_TOFU_VALIDATE=1 go test -run TestAWSRootValidates ./cmd/devboxen/

  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash -n box/*.sh host/bin/devbox host/bin/devbox-admin box/tests/*.sh box/seccomp/generate.sh
      - run: node --check box/web-api.js && node --check box/web-vnc.js && node --check box/web-expose.js && node --check cmd/devboxen-web/ui/app.js
