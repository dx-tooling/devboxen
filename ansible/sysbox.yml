---
# Sysbox on the devboxen hosts: the container runtime the boxes run on (../box/). Sysbox
# lets an unprivileged container run its own
# Docker daemon: root inside is mapped to an unprivileged user range on the host, no
# --privileged, no host Docker socket.
#
#   ansible-playbook -i <inventory> sysbox.yml --check --diff
#
# Zero downtime by construction: the Sysbox installer only SIGHUPs dockerd to register the
# runtime (runtimes are hot-reloadable), and never restarts Docker while containers exist.
# /etc/docker/daemon.json is installed FIRST so the installer finds everything it would
# otherwise add itself (see ../host/docker/daemon.json and docs/box.md for why
# bip/default-address-pools are pinned to Docker's defaults).
- name: Sysbox container runtime (for the boxes)
  hosts: devboxen_hosts
  gather_facts: false
  become: false # already root

  vars:
    host_files: "{{ playbook_dir }}/../host"
    sysbox_version: "0.7.1"
    sysbox_deb: "sysbox-ce_{{ sysbox_version }}.linux_amd64.deb"
    # Published in the release notes of https://github.com/nestybox/sysbox/releases/tag/v0.7.1
    sysbox_sha256: "9d6d5484f980d0a17f86c492c1262015c2afb66280bdb97215b79fde6a0261c5"

  handlers:
    - name: load bwrap AppArmor profile
      ansible.builtin.command: apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict

    - name: reload docker
      # SIGHUP: picks up `runtimes` without touching running containers. bip and
      # default-address-pools are only read at a restart; they equal Docker's built-in
      # defaults, so a later restart changes nothing.
      ansible.builtin.systemd_service:
        name: docker
        state: reloaded

  tasks:
    # Ubuntu 24.04 restricts unprivileged user namespaces. Codex uses /usr/bin/bwrap
    # from the box image; this profile permits only that binary to set up its sandbox.
    # Keep kernel.apparmor_restrict_unprivileged_userns enabled for other processes.
    - name: Ubuntu's Bubblewrap AppArmor profile is available
      ansible.builtin.apt:
        name: apparmor-profiles
        state: present
        update_cache: true
        cache_valid_time: 86400

    # A fresh host does not have the source until the apt task runs. In check mode
    # Ansible reports that install but cannot inspect a file it has not created.
    - name: Check for Ubuntu's Bubblewrap profile
      ansible.builtin.stat:
        path: /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
      register: bwrap_profile_source
      check_mode: false

    - name: Bubblewrap's user namespace profile is installed
      ansible.builtin.copy:
        src: /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
        dest: /etc/apparmor.d/bwrap-userns-restrict
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      notify: load bwrap AppArmor profile
      when: bwrap_profile_source.stat.exists or not ansible_check_mode

    - name: Docker daemon config (validated with dockerd --validate)
      ansible.builtin.copy:
        src: "{{ host_files }}/docker/daemon.json"
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: "0644"
        validate: "dockerd --validate --config-file %s"
      notify: reload docker

    - name: Docker has read its config before Sysbox is installed
      ansible.builtin.meta: flush_handlers

    # needrestart can restart Sysbox during unattended library upgrades, orphaning
    # running boxes. Their processes survive, but docker exec and new sessions fail.
    - name: Keep needrestart from restarting Sysbox under running boxes
      ansible.builtin.copy:
        src: "{{ host_files }}/needrestart/99-sysbox.conf"
        dest: /etc/needrestart/conf.d/99-sysbox.conf
        owner: root
        group: root
        mode: "0644"
        validate: "perl -c %s"

    - name: Sysbox package is downloaded (checksum-verified)
      ansible.builtin.get_url:
        url: "https://github.com/nestybox/sysbox/releases/download/v{{ sysbox_version }}/{{ sysbox_deb }}"
        dest: "/var/cache/apt/archives/{{ sysbox_deb }}"
        checksum: "sha256:{{ sysbox_sha256 }}"
        mode: "0644"

    # In a dry run on a fresh host the package was not downloaded, so there is nothing to
    # compare against; the install then only runs for real.
    - name: Check for the downloaded Sysbox package
      ansible.builtin.stat:
        path: "/var/cache/apt/archives/{{ sysbox_deb }}"
      register: sysbox_deb_file
      check_mode: false

    - name: Sysbox is installed
      ansible.builtin.apt:
        deb: "/var/cache/apt/archives/{{ sysbox_deb }}"
        state: present
      when: sysbox_deb_file.stat.exists or not ansible_check_mode

    - name: Sysbox services are enabled and running
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - sysbox-mgr
        - sysbox-fs
        - sysbox
      when: sysbox_deb_file.stat.exists or not ansible_check_mode

    - name: Docker knows the sysbox-runc runtime
      ansible.builtin.command: docker info --format '{{ "{{" }}json .Runtimes{{ "}}" }}'
      register: docker_runtimes
      changed_when: false
      check_mode: false
      failed_when: "'sysbox-runc' not in docker_runtimes.stdout and not ansible_check_mode"
