# A devboxen inventory (the CLI writes one from devboxen.toml; this is what it looks like).
# Every host is reached over SSH as root with a key.

[devboxen_hosts]
# A VPS that is always on.
box1 ansible_host=203.0.113.10 ansible_user=root devboxen_host_name=box1
# An on-demand EC2 host (tofu/aws-host): its data lives on a separate EBS volume.
cloud ansible_host=198.51.100.20 ansible_user=root devboxen_host_name=cloud devboxen_data_volume_id=vol-0123456789abcdef0

# The host that serves the browser UI; the others are reached through SSH tunnels.
[devboxen_front]
box1

[devboxen_hosts:vars]
ansible_python_interpreter=/usr/bin/python3
devboxen_web_tls=auto
devboxen_web_domain=devboxen.example.com
