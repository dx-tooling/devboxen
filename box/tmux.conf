# tmux in the devbox: the host's `devbox` command runs every interactive session in a named
# tmux session, so it outlives a dropped connection and is reattached on reconnect.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-ghostty:Tc"
set -g escape-time 10          # Esc reaches Claude Code at once
set -g history-limit 100000
set -g mouse on
set -g focus-events on
set -g set-clipboard on        # OSC 52: copy in tmux lands in the laptop's (or browser's) clipboard
# Nothing from the attaching client's environment: no SSH agent goes into a box (GitHub is
# reached over HTTPS with the shared tokens, docs/box.md "GitHub").
set -g update-environment ""
# The host's `devbox` command replaces this with [host:box:session] when it attaches.
set -g status-left "[devbox:#S] "
set -g status-left-length 30
