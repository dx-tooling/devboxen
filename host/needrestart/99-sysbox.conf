# Keep a running Sysbox container attached to its sysbox-fs/sysbox-mgr state.
# Restarting those daemons while boxes run leaves docker exec unable to enter them.
# Merge with needrestart's existing overrides (including Docker), rather than replacing them.
$nrconf{override_rc} = { %{$nrconf{override_rc} // {}}, qr(^sysbox) => 0 };
