# Key-only SSH: no password logins for anyone, root only with a key. (A host with password
# logins on draws hundreds of thousands of attempts.) sshd takes the first value it reads,
# and this drop-in is included at the top of the stock sshd_config, so it wins there.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
